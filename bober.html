/* ===== Price calculator ===== */
const BASE_PRICE = 12; // zł/m²

function calcPrice({ area, dirtLevel, impregnation, weedsRemoval }) {
  let price = area * BASE_PRICE;
  if (dirtLevel === "heavy")   price *= 1.35;
  if (dirtLevel === "extreme") price *= 1.65;
  if (impregnation)  price += area * 8;
  if (weedsRemoval)  price += area * 5;
  return Math.round(price);
}

                  <path d="M9 18l-6-6 6-6M15 6l6 6-6 6"/>
                </svg>
              </div>
            </div>
            {/* Labels */}
            <div className="absolute bottom-3 left-4 bg-black/50 text-white text-xs font-bold px-3 py-1 rounded-full">PRZED</div>
            <div className="absolute bottom-3 right-4 bg-blue-600/80 text-white text-xs font-bold px-3 py-1 rounded-full">PO</div>
          </div>
        </div>
      </section>

      {/* ===== Services ===== */}
      <section id="uslugi" className="py-16 px-4 bg-white">
        <div className="max-w-6xl mx-auto">
          <div className="text-center mb-12">
            <h2 className="text-3xl font-black text-gray-900 mb-2">Nasze usługi</h2>
            <p className="text-gray-500">Kompleksowa oferta mycia i renowacji nawierzchni</p>
          </div>
          <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-6">
            {[
              { icon:"🧱", title:"Kostka brukowa", desc:"Mycie ciśnieniowe z usuwaniem chwastów, mchów i alg. Fugowanie i piaskowanie." },
              { icon:"🏡", title:"Podjazdy i parkingi", desc:"Głębokie czyszczenie betonu i kostki. Odtłuszczanie, usuwanie plam z oleju." },
              { icon:"🌿", title:"Tarasy i patio", desc:"Delikatne mycie płyt granitowych, ceramicznych i betonowych. Impregnacja." },
              { icon:"🏗️", title:"Elewacje", desc:"Mycie tynków, cegły klinkierowej. Usuwanie grzybów i pleśni." },
              { icon:"🛡️", title:"Impregnacja", desc:"Zabezpieczenie po myciu. Ochrona przed wodą, olejem i porastaniem. Na lata." },
              { icon:"🌱", title:"Usuwanie chwastów", desc:"Wypalanie lub chemiczne zwalczanie chwastów w spoinach. Trwałe rezultaty." },
            ].map(s => (
              <div key={s.title} className="border border-gray-100 rounded-2xl p-6 hover:shadow-lg transition-shadow group">
                <div className="text-4xl mb-4 group-hover:scale-110 transition-transform inline-block">{s.icon}</div>
                <h3 className="font-bold text-xl text-gray-900 mb-2">{s.title}</h3>
                <p className="text-gray-500 text-sm leading-relaxed">{s.desc}</p>
              </div>
            ))}
          </div>
        </div>
      </section>

      {/* ===== Why us ===== */}
      <section className="py-16 px-4 bg-blue-50">
        <div className="max-w-6xl mx-auto">
          <div className="text-center mb-12">
            <h2 className="text-3xl font-black text-gray-900 mb-2">Dlaczego BOBER TEAM?</h2>
          </div>
          <div className="grid sm:grid-cols-2 lg:grid-cols-4 gap-6">
            {[
              { icon:<IconTools />,    color:"bg-blue-100 text-blue-600",   title:"Pro sprzęt",        desc:"Maszyny Kärcher z regulacją ciśnienia do każdej nawierzchni." },
              { icon:<IconShield />,   color:"bg-green-100 text-green-600", title:"Gwarancja",         desc:"Jeśli efekt Cię nie satysfakcjonuje – wracamy i poprawiamy." },
              { icon:<IconClock />,    color:"bg-yellow-100 text-yellow-600",title:"Punktualność",      desc:"Szanujemy Twój czas. Przyjeżdżamy zawsze o umówionej porze." },
              { icon:<IconCash />,     color:"bg-purple-100 text-purple-600",title:"Uczciwa cena",      desc:"Bezpłatna wycena, stała cena – bez ukrytych opłat." },
            ].map(w => (
              <div key={w.title} className="bg-white rounded-2xl p-6 text-center shadow-sm hover:shadow-md transition-shadow">
                <div className={`w-14 h-14 ${w.color} rounded-full flex items-center justify-center mx-auto mb-4`}>
                  {w.icon}
                </div>
                <h3 className="font-bold text-lg text-gray-900 mb-2">{w.title}</h3>
                <p className="text-gray-500 text-sm leading-relaxed">{w.desc}</p>
              </div>
            ))}
          </div>
        </div>
      </section>

      {/* ===== Gallery ===== */}
      <section id="galeria" className="py-16 px-4 bg-white">
        <div className="max-w-6xl mx-auto">
          <div className="text-center mb-8">
            <h2 className="text-3xl font-black text-gray-900 mb-2">Galeria realizacji</h2>
            <p className="text-gray-500">Przykłady naszych prac</p>
          </div>
          {/* Tabs */}
          <div className="flex flex-wrap gap-2 justify-center mb-6">
            {galleryItems.map((g, i) => (
              <button key={g.label}
                onClick={() => setActiveGallery(i)}
                className={`px-5 py-2 rounded-full font-semibold transition-all ${activeGallery === i ? "bg-blue-600 text-white shadow" : "bg-gray-100 text-gray-600 hover:bg-gray-200"}`}>
                {g.label}
              </button>
            ))}
          </div>
          {/* Gallery display */}
          <div className="grid grid-cols-2 md:grid-cols-3 gap-4">
            {[0,1,2,3,4,5].map(i => (
              <div key={i} className="rounded-xl overflow-hidden shadow-md" style={{ aspectRatio:"4/3" }}>
                <div className="w-full h-full flex items-center justify-center text-white font-bold text-lg"
                  style={{
                    background: `linear-gradient(${i*60}deg, ${galleryItems[activeGallery].color}, #0f172a)`,
                    minHeight: "160px"
                  }}>
                  <div className="text-center px-4">
                    <div className="text-3xl mb-1">📸</div>
                    <div className="text-sm opacity-75">{galleryItems[activeGallery].desc}</div>
                    <div className="text-xs opacity-50 mt-1">Zdjęcie {i+1}</div>
                  </div>
                </div>
              </div>
            ))}
          </div>
        </div>
      </section>

      {/* ===== Price Calculator ===== */}
      <section id="kalkulator" className="py-16 px-4 bg-gradient-to-b from-blue-50 to-white">
        <div className="max-w-3xl mx-auto">
          <div className="text-center mb-10">
            <div className="w-14 h-14 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center mx-auto mb-4">
              <IconCalculator />
            </div>
            <h2 className="text-3xl font-black text-gray-900 mb-2">Kalkulator cen</h2>
            <p className="text-gray-500">Orientacyjna wycena – dokładna po wizji terenowej</p>
          </div>
          <div className="bg-white rounded-2xl shadow-xl p-8">
            {/* Area */}
            <div className="mb-6">
              <label className="block font-semibold text-gray-700 mb-3">
                Powierzchnia: <span className="text-blue-600 font-bold">{area} m²</span>
              </label>
              <input type="range" min="10" max="500" step="5" value={area}
                onChange={e => setArea(Number(e.target.value))}
                className="w-full" />
              <div className="flex justify-between text-xs text-gray-400 mt-1">
                <span>10 m²</span><span>500 m²</span>
              </div>
            </div>
            {/* Dirt level */}
            <div className="mb-6">
              <label className="block font-semibold text-gray-700 mb-3">Stopień zabrudzenia</label>
              <div className="grid grid-cols-3 gap-3">
                {[
                  { val:"normal",  label:"Standardowe", emoji:"🟡" },
                  { val:"heavy",   label:"Mocne",        emoji:"🟠" },
                  { val:"extreme", label:"Bardzo mocne", emoji:"🔴" },
                ].map(d => (
                  <button key={d.val}
                    onClick={() => setDirtLevel(d.val)}
                    className={`p-3 rounded-xl border-2 text-center transition-all ${dirtLevel === d.val ? "border-blue-600 bg-blue-50" : "border-gray-200 hover:border-gray-300"}`}>
                    <div className="text-2xl mb-1">{d.emoji}</div>
                    <div className="text-sm font-semibold text-gray-700">{d.label}</div>
                  </button>
                ))}
              </div>
            </div>
            {/* Options */}
            <div className="mb-8 space-y-3">
              <label className="flex items-center gap-3 p-3 rounded-xl border border-gray-200 cursor-pointer hover:bg-gray-50">
                <input type="checkbox" checked={impregnation} onChange={e => setImpregn(e.target.checked)}
                  className="w-5 h-5 accent-blue-600" />
                <div>
                  <div className="font-semibold text-gray-700">Impregnacja (+8 zł/m²)</div>
                  <div className="text-xs text-gray-400">Ochrona na 3-5 lat</div>
                </div>
              </label>
              <label className="flex items-center gap-3 p-3 rounded-xl border border-gray-200 cursor-pointer hover:bg-gray-50">
                <input type="checkbox" checked={weedsRemoval} onChange={e => setWeeds(e.target.checked)}
                  className="w-5 h-5 accent-blue-600" />
                <div>
                  <div className="font-semibold text-gray-700">Usuwanie chwastów (+5 zł/m²)</div>
                  <div className="text-xs text-gray-400">Ze spoin i szczelin</div>
                </div>
              </label>
            </div>
            {/* Result */}
            <div className="bg-gradient-to-r from-blue-600 to-blue-700 rounded-2xl p-6 text-white text-center">
              <div className="text-sm text-blue-200 mb-1">Szacunkowa cena netto</div>
              <div className="text-5xl font-black mb-1">{calcResult} <span className="text-2xl">zł</span></div>
              <div className="text-blue-200 text-sm mb-4">Ostateczna cena po bezpłatnej wizji terenowej</div>
              <button onClick={() => setModal(true)}
                className="bg-yellow-400 hover:bg-yellow-300 text-blue-900 font-black px-8 py-3 rounded-xl transition-all hover:scale-105">
                Zamów bezpłatną wycenę
              </button>
            </div>
          </div>
        </div>
      </section>

      {/* ===== Testimonials ===== */}
      <section id="opinie" className="py-16 px-4 bg-white">
        <div className="max-w-6xl mx-auto">
          <div className="text-center mb-12">
            <h2 className="text-3xl font-black text-gray-900 mb-2">Co mówią klienci?</h2>
            <p className="text-gray-500">Ponad 200 zadowolonych klientów w regionie</p>
          </div>
          <div className="grid md:grid-cols-3 gap-6">
            {testimonials.map(t => (
              <div key={t.name} className="bg-gray-50 rounded-2xl p-6 border border-gray-100 hover:shadow-md transition-shadow">
                <div className="flex gap-0.5 mb-3">
                  {[1,2,3,4,5].map(i => <IconStar key={i} filled={i <= t.stars} />)}
                </div>
                <p className="text-gray-700 italic mb-4 leading-relaxed">"{t.text}"</p>
                <div className="flex items-center gap-3">
                  <div className="w-10 h-10 bg-blue-100 rounded-full flex items-center justify-center font-bold text-blue-700">
                    {t.name[0]}
                  </div>
                  <div>
                    <div className="font-semibold text-gray-900">{t.name}</div>
                    <div className="text-xs text-gray-400">{t.city}</div>
                  </div>
                </div>
              </div>
            ))}
          </div>
        </div>
      </section>

      {/* ===== Service area ===== */}
      <section id="obszar" className="py-16 px-4 bg-blue-700 text-white">
        <div className="max-w-6xl mx-auto">
          <div className="text-center mb-10">
            <h2 className="text-3xl font-black mb-2">Obszar działania</h2>
            <p className="text-blue-200">Dojeżdżamy do 60 km od Pajęczna – bez dopłat za dojazd!</p>
          </div>
          <div className="flex flex-wrap gap-3 justify-center">
            {areas.map(a => (
              <span key={a} className="bg-blue-600/60 border border-blue-500 px-4 py-2 rounded-full font-semibold text-sm hover:bg-blue-500 transition-colors cursor-default">
                📍 {a}
              </span>
            ))}
          </div>
          <p className="text-center text-blue-300 mt-8 text-sm">
            Nie widzisz swojej miejscowości? Zadzwoń – na pewno coś ustalimy!
          </p>
        </div>
      </section>

      {/* ===== CTA ===== */}
      <section className="py-20 px-4 bg-gradient-to-br from-yellow-400 to-amber-400">
        <div className="max-w-3xl mx-auto text-center">
          <div className="text-5xl mb-4">🦫</div>
          <h2 className="text-4xl font-black text-blue-900 mb-4">Gotowy na błyszczącą kostkę?</h2>
          <p className="text-blue-800 text-lg mb-8">Zadzwoń lub napisz – wycena jest zawsze bezpłatna i bez zobowiązań!</p>
          <div className="flex flex-wrap gap-4 justify-center">
            <button onClick={() => setModal(true)}
              className="bg-blue-700 hover:bg-blue-800 text-white font-black text-xl px-10 py-4 rounded-xl shadow-lg transition-all hover:scale-105">
              Zamów wycenę online
            </button>
            <a href="tel:+48500000000"
              className="bg-white hover:bg-gray-50 text-blue-900 font-black text-xl px-10 py-4 rounded-xl shadow-lg transition-all hover:scale-105 flex items-center gap-2">
              <IconPhone /> Zadzwoń teraz
            </a>
          </div>
        </div>
      </section>

      {/* ===== Footer ===== */}
      <footer className="bg-gray-900 text-gray-400 py-10 px-4">
        <div className="max-w-6xl mx-auto">
          <div className="grid md:grid-cols-3 gap-8 mb-8">
            <div>
              <div className="font-black text-white text-xl mb-2">BOBER TEAM</div>
              <p className="text-sm leading-relaxed">Profesjonalne mycie i renowacja nawierzchni brukowych. Pajęczno i okolice.</p>
            </div>
            <div>
              <div className="font-bold text-white mb-3">Kontakt</div>
              <div className="space-y-2 text-sm">
                <div className="flex items-center gap-2"><IconPhone /><a href="tel:+48500000000" className="hover:text-white">+48 500 000 000</a></div>
                <div className="flex items-center gap-2"><IconMail /><a href="mailto:bober@example.pl" className="hover:text-white">bober@example.pl</a></div>
                <div className="flex items-center gap-2"><IconMapPin /><span>Pajęczno, woj. łódzkie</span></div>
              </div>
            </div>
            <div>
              <div className="font-bold text-white mb-3">Usługi</div>
              <ul className="space-y-1 text-sm">
                {["Mycie kostki brukowej","Mycie podjazdów","Czyszczenie tarasów","Mycie elewacji","Impregnacja nawierzchni"].map(s => (
                  <li key={s} className="hover:text-white cursor-default">→ {s}</li>
                ))}
              </ul>
            </div>
          </div>
          <div className="border-t border-gray-800 pt-6 text-center text-xs">
            © 2025 BOBER TEAM – Mycie Ciśnieniowe. Wszelkie prawa zastrzeżone.
          </div>
        </div>
      </footer>

      {/* ===== Modal Contact Form ===== */}
      {isModalOpen && (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4"
          style={{ background: "rgba(0,0,0,0.6)", backdropFilter: "blur(4px)" }}>
          <div className="bg-white rounded-2xl shadow-2xl w-full max-w-md p-8 relative animate-in">
            <button onClick={() => setModal(false)}
              className="absolute top-4 right-4 text-gray-400 hover:text-gray-700 text-2xl font-bold leading-none">×</button>
            {formSubmitted ? (
              <div className="text-center py-8">
                <div className="text-6xl mb-4">✅</div>
                <h3 className="text-2xl font-black text-gray-900 mb-2">Dziękujemy!</h3>
                <p className="text-gray-500">Skontaktujemy się z Tobą w ciągu 24 godzin.</p>
              </div>
            ) : (
              <>
                <h3 className="text-2xl font-black text-gray-900 mb-6">Bezpłatna wycena</h3>
                <form onSubmit={handleFormSubmit} className="space-y-4">
                  <div>
                    <label className="block text-sm font-semibold text-gray-700 mb-1">Imię i nazwisko *</label>
                    <input type="text" name="name" value={formData.name} onChange={handleFormChange} required
                      placeholder="Jan Kowalski"
                      className="w-full border border-gray-200 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500" />
                  </div>
                  <div>
                    <label className="block text-sm font-semibold text-gray-700 mb-1">Telefon *</label>
                    <input type="tel" name="phone" value={formData.phone} onChange={handleFormChange} required
                      placeholder="+48 500 000 000"
                      className="w-full border border-gray-200 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500" />
                  </div>
                  <div>
                    <label className="block text-sm font-semibold text-gray-700 mb-1">E-mail</label>
                    <input type="email" name="email" value={formData.email} onChange={handleFormChange}
                      placeholder="jan@example.pl"
                      className="w-full border border-gray-200 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500" />
                  </div>
                  <div>
                    <label className="block text-sm font-semibold text-gray-700 mb-1">Opis zlecenia</label>
                    <textarea name="message" value={formData.message} onChange={handleFormChange} rows="3"
                      placeholder="Np. podjazd ok. 60 m², mocno zabrudzony, interesuje mnie impregnacja..."
                      className="w-full border border-gray-200 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500 resize-none" />
                  </div>
                  <button type="submit"
                    className="w-full bg-blue-600 hover:bg-blue-700 text-white font-black py-4 rounded-xl transition-all hover:scale-105 text-lg">
                    Wyślij zapytanie →
                  </button>
                  <p className="text-xs text-gray-400 text-center">Odpowiadamy w ciągu 24h. Bezpłatna wycena bez zobowiązań.</p>
                </form>
              </>
            )}
          </div>
        </div>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
